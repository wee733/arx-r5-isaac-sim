format: isaac_grasp
format_version: 1.0

object_frame: /tagged_cube
gripper_frame: /link6

# The ARX grasp frame is 0.11 m along link6 +X, while the fingertip collision
# mesh reaches about 0.158 m. A +90 degree pitch points that axis down. The
# 0.14 m height keeps the fingertips clear of the table and still surrounds
# the 50 mm cube; the attachment controller preserves the resulting offset.
grasps:
  grasp_top:
    confidence: 1.0
    position: [0.0, 0.0, 0.14]
    orientation: {w: 0.7071068, xyz: [0.0, 0.7071068, 0.0]}
    cspace_position: {joint7: 0.0}
    pregrasp_cspace_position: {joint7: 0.044}
