# USD scene contract for the VLA data-collection workcell.
#
# The workcell has no table. The R5A is mounted on a 0.35 m column and pitched
# 15 degrees forward; objects rest on a 0.15 m platform in front of it. The
# base_link -> camera extrinsics are copied verbatim from the AprilTag workcell
# (arx_sim_usd_scene.yaml) and must stay byte-identical to it.

schema_version: 1

robot:
  robot_prim_path: /R5a
  base_prim_path: /R5a/base_link
  world_frame: world
  base_frame: base_link
  # Column-mounted pose: 0.35 m above the floor, Ry(+15 deg) forward pitch.
  # scripts/author_vla_scene.py writes these exact values into the USD, so the
  # scene and this contract cannot drift apart the way the AprilTag scene did.
  expected_world_to_base_translation: [-0.2, 0.0, 0.35]
  expected_world_to_base_rotation: [0.0, 0.1305261922, 0.0, 0.9914448614]
  # The NVIDIA sensor assets carry their own dynamic rigid bodies. They are
  # visual sensors mounted to articulation links here, so the runtime disables
  # those nested rigid bodies in a non-persistent session layer.
  sensor_rigid_body_paths:
    - /R5a/base_link/ZED_X
    - /R5a/link6/rsd455/RSD455

# The block is visual-only in the authored USD. Runtime session overrides add a
# rigid body and collider without modifying that file.
source_object:
  prim_path: /World/Workspace/Block
  collision_prim_path: /World/Workspace/Block/Body
  grasp_body_prim_path: /R5a/link6
  grasp_frame_prim_path: /R5a/link6/grasp_frame
  # Geometry lives in vla_task.yaml; keep this fallback mass identical so a
  # tool that loads only the USD scene contract cannot silently change the
  # object's dynamics.
  mass_kg: 0.05

# No `tags:` section. The VLA workcell carries no AprilTag textures; the loader
# treats the section as optional and the runtime skips texture repair.

cameras:
  zedx:
    # Eye-to-hand mount exactly as authored in the user's USD. The camera is
    # in front of the ARX workcell; its pose must not be synthesized here.
    camera_prim_path: /R5a/base_link/ZED_X/base_link/ZED_X/CameraLeft
    parent_prim_path: /R5a/base_link
    parent_frame: base_link
    optical_frame: zed_x_left_camera_optical_frame
    # The authored ZED mount itself is exactly [0.28, 0.0, -0.02]. The value
    # below is the left optical frame after the ZED asset's internal sensor
    # offset; it must not be mistaken for, or written back to, the mount pose.
    expected_parent_to_optical_translation: [0.295, 0.06, -0.005]
    expected_optical_forward: [1.0, 0.0, 0.0]
    # ZED X wide lens: 2.208 mm focal, 5.76 mm horizontal aperture -> 105 deg
    # HFOV and 78.4 deg VFOV at this 16:10 resolution. vla_task.yaml asserts
    # every randomized object pose lands inside that frustum.
    width: 1920
    height: 1200
    # The render product runs at 30 Hz in this workcell. A skip count of 2
    # produced only ~10 Hz in recorded simulation timestamps; GR00T raw-v1 is
    # defined at 30 Hz, so publish every rendered frame.
    frame_skip_count: 0
    color_image_topic: /zed_x/left/image_raw
    color_info_topic: /zed_x/left/camera_info
    depth_image_topic: /zed_x/aligned_depth_to_left/image_raw
    depth_info_topic: /zed_x/aligned_depth_to_left/camera_info

  d455:
    camera_prim_path: /R5a/link6/rsd455/RSD455/Camera_OmniVision_OV9782_Color
    parent_prim_path: /R5a/link6
    parent_frame: link6
    optical_frame: d455_color_optical_frame
    # This is a rigid hand-eye calibration edge. base_link -> link6 remains
    # time-varying and comes from robot_state_publisher at the image timestamp.
    expected_parent_to_optical_translation: [0.1044276157, -0.0115000179, 0.0767273606]
    expected_optical_forward: [0.8660253514, 0.0, -0.5000000908]
    width: 1280
    height: 800
    frame_skip_count: 0
    color_image_topic: /d455/color/image_raw
    color_info_topic: /d455/color/camera_info
    depth_image_topic: /d455/aligned_depth_to_color/image_raw
    depth_info_topic: /d455/aligned_depth_to_color/camera_info
