schema_version: 1

robot:
  robot_prim_path: /R5a
  base_prim_path: /R5a/base_link
  world_frame: world
  base_frame: base_link
  # This quaternion is the transform authored in arx_sim.usd. Do not replace
  # it with an identity pose: the scene was deliberately designed in Isaac
  # Sim, including the robot's small Y rotation and its world placement.
  expected_world_to_base_rotation: [0.0, 0.0871557427, 0.0, 0.9961946981]
  # The NVIDIA sensor assets carry their own dynamic rigid bodies. They are
  # visual sensors mounted to articulation links here, so the runtime disables
  # those nested rigid bodies in a non-persistent session layer.
  sensor_rigid_body_paths:
    - /R5a/base_link/ZED_X
    - /R5a/link6/rsd455/RSD455

# The binary USD is the user's authored workcell and is the source of truth.
# ``as-authored`` is always the default and never moves any authored prim.
# ``front-demo`` is an explicit, opt-in anonymous session layout for the
# front-camera reachability demo. It translates only the robot root; in
# particular, it deliberately does not counter-translate the ZED mount.
layouts:
  as-authored:
    prim_translations: {}
    camera_parent_to_optical_translations: {}
  front-demo:
    # Authored /R5a is (-0.548305509, 0, 0.4). Replacing only this root
    # translation with (0, 0, 0.4) moves the complete ARX/ZED assembly by
    # +0.548305509 m in world X, so ZED remains +X from base_link.
    prim_translations:
      /R5a: [0.0, 0.0, 0.4]
    camera_parent_to_optical_translations: {}

# The hand-authored red block is visual-only in the source USD. Runtime
# session overrides add a rigid body and collider without modifying that file.
source_object:
  prim_path: /World/Workspace/TaggedCube
  collision_prim_path: /World/Workspace/TaggedCube/Body
  grasp_body_prim_path: /R5a/link6
  grasp_frame_prim_path: /R5a/link6/grasp_frame
  mass_kg: 0.05

tags:
  source_texture_prim: /World/Workspace/TaggedCube/AprilTag_0/Material/Shader
  target_texture_prim: /World/Workspace/DropTag_1/Material/Shader

cameras:
  zedx:
    # Eye-to-hand mount exactly as authored in the user's USD. The camera is
    # in front of the ARX workcell; its pose must not be synthesized here.
    camera_prim_path: /R5a/base_link/ZED_X/base_link/ZED_X/CameraLeft
    parent_prim_path: /R5a/base_link
    parent_frame: base_link
    optical_frame: zed_x_left_camera_optical_frame
    expected_parent_to_optical_translation: [0.295, 0.06, -0.005]
    expected_optical_forward: [1.0, 0.0, 0.0]
    # Keep the authored 16:10 field of view and render at the ZED X native
    # 1920x1200 mode. At 1280x800 the source tag spans only about 32 pixels
    # and its PnP pose can flip between ambiguous solutions even though
    # cuAprilTag still reports a detection.
    width: 1920
    height: 1200
    frame_skip_count: 2
    color_image_topic: /zed_x/left/image_raw
    color_info_topic: /zed_x/left/camera_info
    depth_image_topic: /zed_x/aligned_depth_to_left/image_raw
    depth_info_topic: /zed_x/aligned_depth_to_left/camera_info

  d455:
    camera_prim_path: /R5a/link6/rsd455/RSD455/Camera_OmniVision_OV9782_Color
    parent_prim_path: /R5a/link6
    parent_frame: link6
    optical_frame: d455_color_optical_frame
    # This is a rigid hand-eye calibration edge. base_link -> link6 remains
    # time-varying and comes from robot_state_publisher at the image timestamp.
    expected_parent_to_optical_translation: [0.1044276157, -0.0115000179, 0.0767273606]
    expected_optical_forward: [0.8660253514, 0.0, -0.5000000908]
    width: 1280
    height: 800
    frame_skip_count: 2
    color_image_topic: /d455/color/image_raw
    color_info_topic: /d455/color/camera_info
    depth_image_topic: /d455/aligned_depth_to_color/image_raw
    depth_info_topic: /d455/aligned_depth_to_color/camera_info
