# AutoData task descriptor (same schema as third_party/AutoData/autodata_examples/tasks).
# Source data: scripts/door/autodata/convert_seed.py output (robot-root frame).
name: arx_knob_hold_open
description: Grasp and unlock the knob, then physically open the door while holding it.
algo: skillgen
generation_policy:
  name: arx_knob_hold_open
  seed: 13
  num_trials: 1
  guarantee_success: false
  keep_failed: true
  use_skillgen: true
  select_src_per_subtask: false
  transform_first_robot_pose: false
  interpolate_from_last_target_pose: true
subtasks:
  link6:
    # The official Datastream reports articulation root poses. The door is closed at
    # the subtask start, so the knob is rigidly fixed to the door root there and a
    # door-relative transform equals the knob-relative one.
    - object_ref: door
      description: Hold knob through unlocking and full opening.
      subtask_start_signal: knob_interaction
      # The pinned pool (unchanged e417401..953cd37) indexes start signals using the TERM name, even for its
      # last subtask. Keep this key; the last segment still ends at actions[T].
      subtask_term_signal: knob_interaction
      selection_strategy: nearest_neighbor_object
      selection_strategy_kwargs:
        nn_k: 1
      subtask_term_offset_range: [0, 0]
      algo_params:
        subtask_start_offset_range: [0, 0]
      action_noise: 0.0
      num_interpolation_steps: 0
      num_fixed_steps: 0
      apply_noise_during_interpolation: false
