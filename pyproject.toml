[tool.pytest.ini_options]
# Door pipeline tests run in the selected Isaac venv; ROS package tests
# live in arx_r5_isaac_sim_bringup/test and run in a ROS-sourced Python.
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "copyright: ROS copyright linter",
  "flake8: ROS flake8 linter",
  "linter: ROS package linter",
  "pep257: ROS docstring linter",
]

[tool.ruff]
line-length = 99
target-version = "py311"
